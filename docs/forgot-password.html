<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Password Reset — RUGIPO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="images/rugipo-logo.jpg" alt="RUGIPO Crest" style="width:42px;height:42px;border-radius:50%;object-fit:cover;">
    <div>
      <div class="name">RUGIPO</div>
      <div class="sub">Rufus Giwa Polytechnic, Owo</div>
    </div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="student-login.html">Student Login</a>
  </nav>
</header>

<section class="admin-login">
  <h2>Reset Your Student Password</h2>
  <p class="note">Enter your JAMB registration number and the email you used when applying. A temporary password will be generated.</p>

  <label for="studentRegInput">JAMB Reg No. / Matric No. / Application No.</label>
  <input id="studentRegInput" placeholder="e.g. 20261234567AB">

  <label for="studentEmailInput">Email Used When Applying</label>
  <input id="studentEmailInput" type="email" placeholder="you@example.com">

  <button class="btn-block" onclick="resetStudentPassword()">Reset Password</button>
  <p id="resetError" class="note error" style="display:none;"></p>
  <div id="resetSuccess" style="display:none;">
    <div class="ticket" style="margin-top:14px;">
      <div class="ticket-row"><span>Your temporary password</span><span id="tempPasswordDisplay" style="font-weight:bold;"></span></div>
    </div>
    <p class="note">Log in with this password from the Student Login page.</p>
    <a href="student-login.html" class="btn-block" style="display:block;text-align:center;text-decoration:none;margin-top:10px;">Go to Student Login</a>
  </div>
</section>

<script>
  const API_BASE = 'https://rugipo-portal.onrender.com/api';

  async function resetStudentPassword(){
    const regOrJamb = document.getElementById('studentRegInput').value.trim();
    const email = document.getElementById('studentEmailInput').value.trim();
    const errorBox = document.getElementById('resetError');
    errorBox.style.display = 'none';

    if(!regOrJamb || !email){
      errorBox.textContent = 'Please fill in both fields.';
      errorBox.style.display = 'block';
      return;
    }

    try{
      const res = await fetch(`${API_BASE}/applications/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ regOrJamb, email })
      });
      const data = await res.json();

      if(!res.ok){
        errorBox.textContent = data.error || 'Could not reset password.';
        errorBox.style.display = 'block';
        return;
      }

      document.getElementById('tempPasswordDisplay').textContent = data.tempPassword;
      document.getElementById('resetSuccess').style.display = 'block';
      document.querySelectorAll('.admin-login > label, .admin-login > input, .admin-login > button').forEach(el => el.style.display = 'none');
    }catch(err){
      errorBox.textContent = 'Could not reach the server. Is the backend running?';
      errorBox.style.display = 'block';
    }
  }
</script>

</body>
</html>
