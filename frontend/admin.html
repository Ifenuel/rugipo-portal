<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — RUGIPO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="images/rugipo-logo.jpg" alt="RUGIPO Crest" style="width:42px;height:42px;border-radius:50%;object-fit:cover;">
    <div>
      <div class="name">RUGIPO</div>
      <div class="sub">Rufus Giwa Polytechnic, Owo</div>
    </div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="calendar.html">Academic Calendar</a>
    <a href="status.html">Check Status</a>
    <a href="pay.html">Pay Fees</a>
    <a href="student-login.html">Student Login</a>
    <a href="admin.html">Staff Login</a>
    <button type="button" onclick="window.location.href='index.html'" aria-label="Close" title="Close" style="background:none;border:none;font-size:22px;cursor:pointer;color:inherit;line-height:1;margin-left:10px;">&times;</button>
  </nav>
</header>
<section class="admin-login">
  <h2>Bursary / ICT Login</h2>

  <label for="adminUser">Username</label>
  <input id="adminUser" placeholder="Enter staff username">

  <label for="adminPass">Password</label>
  <input id="adminPass" type="password" placeholder="Enter password">

  <button class="btn-block" onclick="adminLogin()">Log In</button>
  <p class="note" style="margin-top:10px;"><a href="reset-password-staff.html">Forgot your password?</a></p>
  <p class="note">staff accounts for demo</p>
  <p id="loginError" class="note error" style="display:none;"></p>
</section>

<script>
  const API_BASE = 'http://localhost:4000/api';
  async function adminLogin(){
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value.trim();
    const errorBox = document.getElementById('loginError');
    errorBox.style.display = 'none';
    try{
      const res = await fetch(`${API_BASE}/staff/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      if(!res.ok){ errorBox.textContent = 'Incorrect username or password.'; errorBox.style.display = 'block'; return; }
      const data = await res.json();
      sessionStorage.setItem('rugipo_token', data.token);
      sessionStorage.setItem('rugipo_username', data.username);
      sessionStorage.setItem('rugipo_role', data.role);
      sessionStorage.setItem('rugipo_department', data.department || '');
      window.location.href = 'dashboard.html';
    }catch(err){ errorBox.textContent = 'Could not reach the server. Is the backend running?'; errorBox.style.display = 'block'; }
  }
</script>

</body>
</html>
